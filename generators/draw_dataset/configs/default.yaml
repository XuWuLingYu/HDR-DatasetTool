dataset:
  episodes: 16
  fps: 20
  seed: 0
  save_frames: false

output:
  video_only: true
  shard_size: 1000
  write_manifest: false

video:
  width: 512
  height: 512
  target_frames:
  warmup_frames: 0
  hold_final_frames: 0
  codec: libx264
  bit_rate: 2000000
  background_rgb: [232, 235, 238]

boards:
  board_rgb: [252, 252, 248]
  line_rgb: [18, 18, 18]
  target_rect: [0, 0, 0, 0]
  draw_rect: [64, 118, 448, 502]
  stroke_width: 5
  margin: 0.08

prompt:
  enabled: false
  template: "draw {article} {category}"
  origin_xy: [36, 52]
  font_scale: 0.92
  color_rgb: [35, 39, 43]

status_light:
  enabled: true
  mode: end_effector
  radius_px: 11
  pen_down_rgb: [255, 0, 0]
  pen_up_rgb: [0, 255, 0]

sketch:
  min_strokes: 2
  max_strokes: 5
  min_points_per_stroke: 3
  max_points_per_stroke: 8
  shape_mix:
    polyline: 0.45
    rectangle: 0.15
    circle: 0.15
    house: 0.10
    star: 0.08
    face: 0.07

planner:
  frames_per_unit: 42
  min_segment_frames: 3
  lift_frames: 5
  return_home: true
  home_xy: [0.5, 0.0]
  return_frames_per_unit: 42
  pen_contact_noise: 0.0005
  tracking_noise: 0.001

robot:
  visual: screen_normal_ee
  base_xy: [0.52, 0.52]
  link_lengths: [0.34, 0.27, 0.18]
  joint_limits:
    - [-2.8, 2.8]
    - [-2.7, 2.7]
    - [-2.6, 2.6]
  elbow_up: true
  pen_length: 0.055
  visual_occlusion:
    rod_width_px: 30
    rod_height_px: 220
    joint_radius_px: 30
    inner_radius_px: 22
