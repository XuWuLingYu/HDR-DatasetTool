[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdr-dataset-tool"
version = "0.1.0"
description = "Video reasoning dataset generators and evaluators."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "av",
    "imageio",
    "imageio-ffmpeg",
    "networkx",
    "numpy",
    "opencv-python",
    "pillow",
    "pyyaml",
    "tqdm",
]

[tool.setuptools.packages.find]
include = ["generators*", "evaluators*"]
